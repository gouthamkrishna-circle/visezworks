    <path d="M 50 8 L 72 23 L 61 23 L 50 15 L 39 23 L 28 23 Z" fill="#f95700" />
    
    <!-- Stylized W Mark -->
    <polygon points="22,29 37,29 47,72 32,72" fill="#1e2530" />
