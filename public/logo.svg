    <polygon points="60,39 77,29 64,61 48,72" fill="#1e2530" />
  </g>

  <!-- Typography VISEZWORKS -->
  <text x="250" y="180" text-anchor="middle" font-family="'Archivo', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="42" letter-spacing="0.22em">
    <tspan fill="#1e2530">VISE</tspan><tspan fill="#f95700">Z</tspan><tspan fill="#1e2530">WORKS</tspan>
  </text>

  <!-- Accent Lines and Tagline -->
